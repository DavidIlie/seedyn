name: Publish container

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: seedyn-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE: ghcr.io/davidilie/seedyn
    steps:
      - name: Prepare immutable image tag
        id: image
        shell: bash
        run: |
          branch=${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}
          sha=${GITHUB_SHA::8}
          timestamp=$(date +%s)
          echo "tag=${branch}-${sha}-${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=seedyn
          cache-to: type=gha,mode=max,scope=seedyn
          tags: |
            ${{ env.IMAGE }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE }}:latest
